<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{ book.title }} · Reader</title><link rel="stylesheet" href="{{ url_for('static',filename='library.css') }}"><script src="/static/pagination.js?v=20261029-resume1"></script><script src="/static/narration.js?v=20261014-handoff1"></script><script src="{{ url_for('static',filename='reader.js',v='20261029-resume1') }}" defer></script><script src="/static/site.js" defer></script><link rel="stylesheet" href="/static/immersive.css?v=20261029-resume1"></head>
<body class="reader-page" data-book-id="{{ book.id }}" data-theme="dark"><header class="topbar reader-topbar"><a class="quiet-link reader-icon" href="/" aria-label="Return to library">←</a><strong id="bookTitle">{{ book.title }}</strong><a class="reader-icon" href="/books/{{ book.id }}" aria-label="Book details">⋯</a><div class="reader-actions" hidden><button id="listenChapter">Listen</button><button id="contentsToggle" aria-controls="contentsPanel">Contents</button><button id="settingsToggle" aria-controls="settingsPanel">Settings</button></div></header>
<button id="returnNarration" class="return-narration" aria-label="Back to Read Aloud" hidden>↪ Back to Read Aloud</button>
<aside id="contentsPanel" class="reader-panel contents-panel" aria-label="Book contents" hidden><div class="panel-heading"><button id="closeContents" aria-label="Back to reading">←</button><h2>Contents</h2></div><div class="contents-book"><img id="contentsCover" alt="" hidden><div><strong id="contentsBookTitle"></strong><p id="contentsAuthor"></p></div></div><small id="contentsChapter"></small><div class="tab-row"><button id="spineTab" aria-pressed="true">Reading order</button><button id="tocTab" aria-pressed="false">Book contents</button></div><input id="sectionSearch" type="search" placeholder="Find a section" aria-label="Search sections"><div class="tab-row"><button id="searchBook">Search text</button><button id="showBookmarks">Bookmarks</button></div><div id="sectionList" class="section-list"></div><div class="pagination"><button id="contentsPrevious" aria-label="Previous 100 chapters">←</button><span id="contentsPage"></span><button id="contentsNext" aria-label="Next 100 chapters">→</button></div></aside>
<aside id="settingsPanel" class="reader-panel settings-panel" hidden><div class="panel-heading"><h2>Make it yours</h2><button id="closeSettings" aria-label="Close settings">×</button></div><label>Appearance<select id="theme"><option value="gray">Charcoal / dark gray</option><option value="dark">Near-black / deep dark</option><option value="lightgray">Light gray</option><option value="light">Original light</option><option value="sepia">Sepia</option></select><span class="theme-swatches" aria-label="Reading theme previews"><button type="button" data-reader-theme="gray" aria-label="Dark gray theme">Aa</button><button type="button" data-reader-theme="dark" aria-label="Black theme">Aa</button><button type="button" data-reader-theme="lightgray" aria-label="Light gray theme">Aa</button></span></label><label><input id="inheritTheme" type="checkbox" checked>Use global appearance for this book</label><label>Global default appearance<select id="globalTheme"><option value="dark">Near-black (default)</option><option value="gray">Charcoal / dark gray</option><option value="lightgray">Light gray</option><option value="light">Original light</option><option value="sepia">Sepia</option></select></label><label>Font<select id="font"><option value="serif">Literary serif</option><option value="sans">Clean sans serif</option><option value="mono">Monospace</option></select></label><label>Font size <output id="fontSizeValue"></output><input id="fontSize" type="range" min="14" max="32" step="1"></label><label>Line spacing<input id="lineHeight" type="range" min="1.2" max="2.4" step="0.1"></label><label>Page width<input id="width" type="range" min="480" max="1000" step="20"></label><label>Reading mode<select id="mode"><option value="scroll">Vertical scroll</option><option value="pages">Page by page</option></select></label><label>Paragraph spacing<input id="paragraphSpacing" type="range" min="0.5" max="2" step="0.1"></label><label>Margins<input id="margin" type="range" min="12" max="60" step="2"></label><label>Alignment<select id="alignment"><option value="left">Left</option><option value="justify">Justified</option></select></label><a id="originalDownload" class="quiet-link" hidden>Download original EPUB ↗</a></aside>
<main class="reader-main"><iframe id="readingFrame" title="Book content" sandbox="allow-same-origin allow-scripts"></iframe><div id="readerLoading" class="loading-overlay" hidden>Opening your book…</div></main>
<button id="revealChrome" class="reveal-chrome reader-icon" aria-label="Show reader controls" hidden>⋯</button>
<div class="reader-bottom-overlay">
<div class="reader-audio-slot"><aside id="readerMini" class="reader-mini" aria-label="Narration controls" hidden><img id="readerMiniCover" alt="" hidden><button id="readerMiniOpen" class="reader-mini-title" aria-label="Open expanded Read Aloud player"><strong id="readerMiniBook"></strong><small id="readerMiniChapter"></small><small id="readerMiniState" role="status"></small></button><button id="readerMiniBack" aria-label="Skip backward 15 seconds">−15</button><button id="readerMiniPlay" aria-label="Play narration">▶</button><button id="readerMiniForward" aria-label="Skip forward 15 seconds">+15</button><button id="readerMiniExpand" aria-label="Expand listening controls">⌃</button><button id="readerMiniClose" aria-label="Stop listening">×</button><progress id="readerMiniProgress" max="1000" value="0" aria-label="Narration playback progress"></progress></aside></div>
<footer class="reader-footer"><div class="reading-status"><span id="sectionTitle"></span><small id="readingStatus" role="status" aria-live="polite">Opening book…</small></div><nav class="reader-dock" aria-label="Reading controls"><button id="dockContents" class="reader-icon" aria-label="Table of contents">☷</button><button id="dockTheme" class="reader-icon" aria-label="Appearance">◐</button><button id="dockSettings" class="reader-icon" aria-label="Typography and reading settings">Aa</button><button id="dockListen" class="reader-icon" aria-label="Start or resume narration"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3M3 13h3v8H3zM18 13h3v8h-3z"/></svg></button><button id="bookmarkToggle" class="reader-icon" aria-label="Bookmark this passage">☆</button></nav><div hidden><button id="previousSection">Previous</button><button id="nextSection">Next</button><button id="followNarration">Follow Along</button><button id="hideChrome">Focus</button></div></footer></div></body></html>
