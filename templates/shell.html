<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Webnovel · Read & Listen</title><link rel="stylesheet" href="/static/library.css"><link rel="stylesheet" href="/static/platform.css"><script src="/static/player_sheet.js?v=20261028-reliability2" defer></script><script src="/static/player.js?v=20261028-reliability2" defer></script><link rel="stylesheet" href="/static/immersive.css?v=20261028-reliability2"><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" content="#17191d"><meta name="apple-mobile-web-app-capable" content="yes"></head><body class="shell-page" data-theme="dark">
<header class="topbar"><a class="brand" href="/library" data-view>◈ Webnovel</a><nav aria-label="Main"><a href="/library" data-view>Library</a><a href="/importer" data-view>Import</a><a href="/jobs" data-view>Jobs</a><a href="/settings" data-view>Settings</a><a href="/audio" data-view>Legacy audio</a></nav></header>
<div id="networkState" role="status" hidden></div><iframe id="workspace" title="Library workspace" src="/library"></iframe>
<button id="playerBackdrop" class="player-backdrop" aria-label="Dismiss expanded player" hidden></button>
<section id="playerPanel" class="player-panel" data-mini="true" hidden aria-label="Audiobook player"><button id="playerHandle" class="player-handle" aria-label="Dismiss expanded player" hidden><span></span></button><div class="player-heading"><img id="playerCover" class="player-cover" alt="" hidden><button id="miniOpen" class="player-title" aria-label="Return to narration"><strong id="playingBook">Audiobook</strong><span id="playingChapter" class="muted"></span></button><button id="miniPrevious" aria-label="Skip backward 15 seconds">−15</button><button id="miniPlay" aria-label="Play narration">▶</button><button id="miniNext" aria-label="Skip forward 15 seconds">+15</button><button id="expandPlayer" class="mini-toggle" aria-expanded="true">Collapse</button><button id="closePlayer" aria-label="Stop listening">×</button></div><progress id="miniProgress" max="1000" value="0" aria-label="Chapter listening progress"></progress><div id="playerStatus" role="status" aria-live="polite"></div>
<audio id="bookAudio" preload="metadata"></audio><section id="spokenPassages" class="spoken-passages" aria-label="Narrated passages"><p>Choose a chapter to listen.</p></section><div class="transport"><button id="audioPrevious" aria-label="Previous chapter">Prev</button><button id="rewind">−15s</button><button id="playPause" aria-label="Play narration">▶</button><button id="forward">+15s</button><button id="audioNext" aria-label="Next chapter">Next</button><span id="audioTime">0:00 / 0:00</span><input id="audioSeek" type="range" step="0.01" min="0" max="1000" value="0" aria-label="Playback position"></div>
<button id="readPlaying" class="read-playing-action">Back to Read Aloud</button><details class="player-settings"><summary>Voice, speed &amp; sleep settings</summary><div class="player-options"><label>Playback<select id="playbackSpeed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option><option value="2.5">2.5×</option><option value="3">3×</option></select></label><label>Voice<select id="playerVoice"><option value="en-US-AndrewNeural">Andrew — English (US)</option></select></label><label>Synthesis<select id="synthesisSpeed"><option value="-25">−25%</option><option value="0" selected>Normal</option><option value="25">+25%</option><option value="50">+50%</option></select></label><label>Volume<input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label><label>Sleep<select id="sleepTimer"><option value="0">Off</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></label><button id="saveDefaultVoice">Save as default</button><span id="defaultVoiceStatus" role="status"></span></div></details><p id="sleepStatus" class="muted" role="status"></p><small class="muted">Edge TTS sends chapter text to an online Microsoft speech service. Cached audio is stored locally.</small></section>
</body></html>
