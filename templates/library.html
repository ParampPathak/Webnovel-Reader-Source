<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Webnovel Library</title><link rel="stylesheet" href="{{ url_for('static',filename='library.css') }}"><script src="{{ url_for('static',filename='library.js',v='20261014-handoff1') }}" defer></script><script src="/static/site.js" defer></script><link rel="stylesheet" href="/static/platform.css"><script src="/static/management.js" defer></script><link rel="stylesheet" href="/static/immersive.css?v=20261014-handoff1"></head>
<body class="library-page"><header class="topbar"><a class="brand" href="/">◈ <span>Webnovel Library</span></a><a class="quiet-link" href="/importer">Import a webnovel</a></header>
<main class="library-main"><section class="hero"><div class="library-intro"><p class="eyebrow">YOUR PRIVATE BOOKSHELF</p><h1>Your next chapter.</h1><p class="muted">Your EPUBs and webnovels, together. Open a book and pick up where you left off.</p></div><form id="uploadForm" class="upload-card"><label for="epubFile">Add a book</label><p class="muted">Upload an EPUB. The original stays intact, and your reading place is saved here.</p><input id="epubFile" name="file" type="file" accept=".epub,application/epub+zip" required><button class="primary" type="submit">Upload EPUB</button><p id="uploadStatus" role="status" aria-live="polite"></p></form></section>
<section aria-label="Book library"><div class="section-heading"><h2>Your library <span id="bookCount" class="muted"></span></h2><input id="bookSearch" type="search" placeholder="Find a title or author" aria-label="Search books"></div><div class="action-row"><label>Sort <select id="librarySort"><option value="added">Recently added</option><option value="recent">Recently opened</option><option value="title">Title</option></select></label><label><input id="favoritesOnly" type="checkbox"> Favorites</label><label><input id="removedBooks" type="checkbox"> Removed books</label><select id="bookKind" aria-label="Book type"><option value="">All books</option><option value="epub">EPUBs</option><option value="webnovel">Webnovels</option></select></div><p id="libraryStatus" role="status"></p><div id="books" class="book-grid"></div><div class="pagination"><button id="previousPage">← Previous</button><span id="pageInfo"></span><button id="nextPage">Next →</button></div></section></main>{% include 'book_controls.html' %}</body></html>
