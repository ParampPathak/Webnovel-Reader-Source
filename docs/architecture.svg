<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
 <title id="title">Webnovel Reader logical architecture</title><desc id="desc">The browser uses Flask APIs. Source adapters and metadata discovery supply bounded imports. SQLite persists library state, independent reading and listening positions, and durable jobs. Background workers generate Edge or Piper narration and publish reusable audio to a cache served by Flask.</desc>
