services:
  webnovel-app:
    build: .
    environment: &storage
      DATA_DIR: /data
      BACKUP_DIR: /backups
      TMPDIR: /data/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      START_TTS_WORKERS: '0'
      AUDIO_CACHE_LIMIT_GIB: ${AUDIO_CACHE_LIMIT_GIB:-20}
      AUDIO_CACHE_CLEANUP_ENABLED: ${AUDIO_CACHE_CLEANUP_ENABLED:-0}
      AUDIO_CACHE_DRY_RUN: ${AUDIO_CACHE_DRY_RUN:-1}
      CHAPTER_UPDATES_ENABLED: ${CHAPTER_UPDATES_ENABLED:-1}
    volumes: &volumes
      - ${DATA_PATH:-./data}:/data
      - ${BACKUP_PATH:-./backups}:/backups
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5000}:5000'
    cpus: '0.5'
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ['CMD','python','-c',"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  webnovel-platform-worker:
    build: .
    command: ['python','platform_worker.py']
    environment:
      <<: *storage
      AUDIO_CACHE_CLEANUP_ENABLED: '0'
      CHAPTER_UPDATES_ENABLED: '0'
    volumes: *volumes
    cpus: '0.5'
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    stop_grace_period: 150s
    restart: unless-stopped
  webnovel-worker:
    build: .
    command: ['python','worker.py']
    environment:
      <<: *storage
      AUDIO_CACHE_CLEANUP_ENABLED: '0'
      CHAPTER_UPDATES_ENABLED: '0'
      WORKER_COUNT: '1'
      PIPER_CONCURRENCY: '1'
      OMP_NUM_THREADS: '2'
    volumes: *volumes
    cpus: '1.5'
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
  kokoro:
    profiles: ['kokoro']
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    cpus: '2'
    restart: unless-stopped
